<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self';"
    />
    <title>Zombie Invasion FPS</title>
    <style>
      :root {
        --font-heading: "Palatino Linotype", "Book Antiqua", Georgia, serif;
        --font-body: "Trebuchet MS", "Segoe UI", sans-serif;
        --game-left: 0px;
        --game-top: 0px;
        --game-right: 0px;
        --game-bottom: 0px;
        --game-width: 100vw;
        --game-height: 100dvh;
        --ink: #f1f9f0;
        --ink-dim: #b5c6b2;
        --accent: #b8f272;
        --accent-strong: #d5ff89;
        --accent-alert: #ffb26a;
        --panel: rgba(9, 15, 18, 0.88);
        --panel-border: rgba(184, 242, 114, 0.5);
        --line: rgba(176, 242, 129, 0.24);
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        min-height: 100svh;
        min-height: 100dvh;
        overflow: hidden;
        touch-action: none;
        font-family: var(--font-body);
        background:
          radial-gradient(circle at 18% 14%, #27343c 0%, rgba(39, 52, 60, 0.18) 26%, transparent 56%),
          radial-gradient(circle at 82% 78%, #2e201a 0%, rgba(46, 32, 26, 0.14) 22%, transparent 55%),
          linear-gradient(165deg, #05090d 0%, #0a1217 48%, #071014 100%);
        color: var(--ink);
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 2;
        opacity: 0.18;
        background:
          repeating-linear-gradient(
            0deg,
            rgba(153, 193, 136, 0.06) 0px,
            rgba(153, 193, 136, 0.06) 1px,
            transparent 1px,
            transparent 3px
          );
      }

      #app {
        position: fixed;
        left: var(--game-left);
        top: var(--game-top);
        width: var(--game-width);
        height: var(--game-height);
        overflow: hidden;
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }

      #rotate-prompt {
        position: fixed;
        inset: var(--game-top) var(--game-right) var(--game-bottom) var(--game-left);
        z-index: 300;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 24px;
        text-align: center;
        font: 700 24px/1.2 var(--font-heading);
        letter-spacing: 0.03em;
        color: var(--accent-strong);
        background: rgba(5, 8, 10, 0.95);
      }

      body.portrait.touch-device #rotate-prompt {
        display: none;
      }

      .fps-overlay {
        position: fixed;
        inset: var(--game-top) var(--game-right) var(--game-bottom) var(--game-left);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 200;
        background: linear-gradient(180deg, rgba(2, 4, 5, 0.74), rgba(2, 4, 5, 0.6));
        backdrop-filter: blur(3px);
        padding:
          calc(env(safe-area-inset-top) + 20px)
          calc(env(safe-area-inset-right) + 20px)
          calc(env(safe-area-inset-bottom) + 20px)
          calc(env(safe-area-inset-left) + 20px);
        box-sizing: border-box;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
      }

      .fps-panel {
        width: min(860px, 100%);
        max-height: calc(var(--game-height) - env(safe-area-inset-top) - env(safe-area-inset-bottom) - 40px);
        border: 1px solid var(--panel-border);
        background:
          linear-gradient(180deg, rgba(18, 28, 25, 0.9), var(--panel)),
          radial-gradient(circle at 18% -10%, rgba(184, 242, 114, 0.1), transparent 58%);
        border-radius: 16px;
        padding: 22px;
        box-sizing: border-box;
        box-shadow:
          0 20px 48px rgba(0, 0, 0, 0.52),
          inset 0 0 0 1px rgba(219, 255, 151, 0.08);
        overflow: auto;
        -webkit-overflow-scrolling: touch;
        touch-action: pan-y;
      }

      .fps-panel h1,
      .fps-panel h2 {
        margin: 0 0 14px;
        font-family: var(--font-heading);
        font-weight: 900;
        letter-spacing: 0.04em;
        color: var(--accent);
        text-transform: uppercase;
        text-shadow: 0 2px 10px rgba(167, 223, 95, 0.24);
      }

      .fps-panel p,
      .fps-shop-row span {
        color: var(--ink);
        font-size: 1.06rem;
      }

      .fps-panel h3 {
        margin: 12px 0 8px;
        font-family: var(--font-heading);
        font-size: 1rem;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        color: var(--accent-strong);
      }

      .fps-panel p {
        margin: 8px 0;
      }

      .fps-panel.menu {
        width: min(760px, 100%);
      }

      .fps-menu-hero {
        display: grid;
        grid-template-columns: minmax(0, 1.2fr) minmax(250px, 0.8fr);
        gap: 18px;
        align-items: stretch;
      }

      .fps-menu-brand,
      .fps-menu-side {
        position: relative;
        min-width: 0;
      }

      .fps-menu-brand {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .fps-menu-kicker {
        margin: 0;
        color: var(--accent-strong);
        font-size: 0.82rem;
        font-weight: 800;
        letter-spacing: 0.22em;
        text-transform: uppercase;
      }

      .fps-menu-logo {
        display: block;
        width: min(100%, 700px);
        height: auto;
        margin: 0 -6px;
        filter: drop-shadow(0 18px 30px rgba(0, 0, 0, 0.34));
      }

      .fps-overlay.summary {
        opacity: 0;
        transition: opacity 280ms ease;
      }

      .fps-overlay.summary .fps-panel.summary {
        opacity: 0;
        transform: translateY(18px) scale(0.985);
        transition:
          opacity 260ms ease,
          transform 340ms cubic-bezier(0.2, 0.85, 0.2, 1);
      }

      .fps-overlay.summary.is-visible {
        opacity: 1;
      }

      .fps-overlay.summary.is-visible .fps-panel.summary {
        opacity: 1;
        transform: translateY(0) scale(1);
      }

      .fps-menu-tagline {
        margin: 0;
        max-width: 56ch;
        color: var(--ink);
        font-size: 1.03rem;
        line-height: 1.5;
      }

      .fps-menu-mobile-brief {
        display: none;
      }

      .fps-menu-mobile-brief p {
        margin: 0;
        color: var(--ink);
        font-size: 0.9rem;
        line-height: 1.28;
      }

      .fps-menu-stats {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 10px;
      }

      .fps-menu-stat {
        padding: 12px 12px 10px;
        border: 1px solid rgba(184, 242, 114, 0.2);
        border-radius: 12px;
        background:
          linear-gradient(180deg, rgba(13, 18, 21, 0.92), rgba(8, 12, 14, 0.92)),
          radial-gradient(circle at 15% 0%, rgba(184, 242, 114, 0.12), transparent 60%);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.03);
      }

      .fps-menu-stat-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 6px;
      }

      .fps-menu-stat-label {
        display: block;
        color: var(--ink-dim);
        font-size: 0.74rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .fps-menu-stat-reset {
        width: 28px;
        height: 28px;
        min-width: 28px;
        padding: 0;
        border-radius: 999px;
        font-size: 16px;
        line-height: 1;
      }

      .fps-menu-stat strong {
        display: block;
        color: var(--accent-strong);
        font-size: clamp(1.15rem, 2.4vw, 1.55rem);
        line-height: 1;
      }

      .fps-menu-side {
        display: grid;
        gap: 12px;
        align-content: start;
        padding: 14px;
        border: 1px solid rgba(184, 242, 114, 0.18);
        border-radius: 14px;
        background:
          linear-gradient(180deg, rgba(10, 14, 17, 0.9), rgba(8, 11, 14, 0.9)),
          radial-gradient(circle at 80% -10%, rgba(255, 113, 88, 0.12), transparent 44%);
      }

      .fps-menu-highlights {
        display: grid;
        gap: 10px;
      }

      .fps-menu-highlight {
        padding: 12px 12px 10px;
        border-radius: 12px;
        border: 1px solid rgba(184, 242, 114, 0.14);
        background: linear-gradient(180deg, rgba(15, 20, 24, 0.82), rgba(11, 15, 18, 0.76));
      }

      .fps-menu-highlight h2 {
        margin: 0 0 4px;
        font-family: var(--font-heading);
        font-size: 0.96rem;
        font-weight: 900;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--accent);
      }

      .fps-menu-highlight p {
        margin: 0;
        color: var(--ink-dim);
        font-size: 0.88rem;
        line-height: 1.35;
      }

      .fps-menu-settings {
        display: grid;
        gap: 8px;
        padding: 12px;
        border-radius: 10px;
        border: 1px solid rgba(184, 242, 114, 0.14);
        background: linear-gradient(180deg, rgba(15, 20, 24, 0.78), rgba(9, 13, 16, 0.72));
      }

      .fps-menu-settings h2 {
        margin: 0;
        font-family: var(--font-heading);
        font-size: 0.9rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--accent);
      }

      .fps-menu-settings label {
        display: flex;
        align-items: center;
        gap: 10px;
        min-height: 30px;
        color: var(--ink);
        font-weight: 750;
      }

      .fps-menu-settings input {
        width: 18px;
        height: 18px;
        accent-color: var(--accent-strong);
      }

      .fps-menu-help {
        margin-top: 16px;
        border: 1px solid rgba(184, 242, 114, 0.28);
        border-radius: 10px;
        background: linear-gradient(180deg, rgba(10, 14, 18, 0.72), rgba(8, 12, 16, 0.62));
        overflow: hidden;
      }

      .fps-menu-help summary {
        list-style: none;
        cursor: pointer;
        padding: 9px 12px;
        font-size: 0.92rem;
        font-weight: 700;
        letter-spacing: 0.02em;
        color: var(--accent-strong);
        border-bottom: 1px solid rgba(184, 242, 114, 0.12);
      }

      .fps-menu-help summary::-webkit-details-marker {
        display: none;
      }

      .fps-menu-help summary span::before {
        content: "+";
        display: inline-block;
        width: 14px;
        margin-right: 8px;
        text-align: center;
      }

      .fps-menu-help[open] summary span::before {
        content: "-";
      }

      .fps-menu-help p {
        margin: 8px 0;
        padding: 0 12px;
        color: var(--ink-dim);
        font-size: 0.92rem;
        line-height: 1.25;
      }

      .fps-menu-help p:last-child {
        padding-bottom: 10px;
      }

      .fps-menu-actions,
      .fps-shop-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 0;
      }

      button {
        border: 1px solid rgba(184, 242, 114, 0.36);
        background: linear-gradient(180deg, rgba(26, 34, 42, 0.88), rgba(12, 17, 23, 0.88));
        color: var(--ink);
        border-radius: 8px;
        padding: 10px 14px;
        font-family: var(--font-body);
        font-size: 16px;
        font-weight: 700;
        letter-spacing: 0.03em;
        text-transform: uppercase;
        transition: background 0.16s ease, transform 0.12s ease, border-color 0.16s ease;
      }

      button:hover {
        border-color: rgba(206, 255, 140, 0.7);
        background: linear-gradient(180deg, rgba(44, 57, 62, 0.92), rgba(18, 24, 28, 0.92));
      }

      button:active {
        transform: translateY(1px);
      }

      button:disabled {
        opacity: 0.42;
        border-color: rgba(255, 255, 255, 0.16);
        color: #9aa99a;
      }

      .fps-shop-list {
        display: grid;
        gap: 8px;
        max-height: min(45vh, 340px);
        overflow: auto;
        -webkit-overflow-scrolling: touch;
        margin-top: 12px;
      }

      .fps-shop-columns {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 250px;
        gap: 14px;
        align-items: start;
      }

      .fps-shop-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }

      .fps-shop-header h2 {
        margin: 0;
      }

      .fps-shop-exit-top {
        flex: 0 0 auto;
        min-width: 96px;
      }

      .fps-shop-recommendation {
        display: grid;
        gap: 4px;
        margin: 8px 0 12px;
        padding: 10px 12px;
        border: 1px solid rgba(221, 255, 147, 0.32);
        border-left: 3px solid rgba(221, 255, 147, 0.78);
        border-radius: 8px;
        background: linear-gradient(90deg, rgba(30, 48, 20, 0.54), rgba(10, 16, 15, 0.36));
      }

      .fps-shop-recommendation strong {
        color: #edffb3;
        font-size: 0.92rem;
      }

      .fps-shop-recommendation span {
        color: var(--ink-dim);
        font-size: 0.82rem;
        line-height: 1.25;
      }

      .fps-summary-callout {
        display: grid;
        gap: 4px;
        margin: 12px 0;
        padding: 10px 12px;
        border-radius: 8px;
        border: 1px solid rgba(255, 148, 86, 0.34);
        border-left: 3px solid rgba(255, 148, 86, 0.82);
        background: linear-gradient(90deg, rgba(68, 28, 16, 0.46), rgba(12, 16, 18, 0.34));
      }

      .fps-summary-callout strong {
        color: #ffd8a8;
        font-size: 0.9rem;
      }

      .fps-summary-callout span,
      .fps-summary-shop-nudge {
        color: var(--ink-dim);
        font-size: 0.86rem;
        line-height: 1.3;
      }

      .fps-shop-main {
        min-width: 0;
      }

      .fps-shop-avatar-panel {
        border: 1px solid rgba(184, 242, 114, 0.25);
        border-radius: 10px;
        background: linear-gradient(180deg, rgba(15, 20, 24, 0.88), rgba(8, 12, 15, 0.9));
        padding: 10px;
      }

      .fps-avatar-stage {
        height: 220px;
        border: 1px solid rgba(184, 242, 114, 0.22);
        border-radius: 10px;
        background:
          radial-gradient(circle at 50% 20%, rgba(168, 204, 255, 0.24), transparent 55%),
          linear-gradient(180deg, rgba(12, 16, 22, 0.92), rgba(11, 14, 16, 0.92));
        position: relative;
        display: grid;
        place-items: end center;
        overflow: hidden;
        touch-action: none;
      }

      .fps-player-avatar {
        --avatar-yaw: 0deg;
        --armor-primary: #687266;
        --armor-secondary: #566154;
        --armor-accent: #98a58b;
        --armor-trim: rgba(255, 255, 255, 0.14);
        --gear-dark: #1b2328;
        --gear-mid: #344049;
        --visor-tint: rgba(154, 224, 255, 0.48);
        --cloth-accent: #847957;
        --skin-light: #efcbad;
        --skin-mid: #d4ae8f;
        --skin-shadow: #b98e70;
        --hair-dark: #2a2626;
        --hair-light: #4b423f;
        width: 148px;
        height: 202px;
        position: relative;
        transform-style: preserve-3d;
        transform: rotateY(var(--avatar-yaw));
        transition: transform 120ms linear;
        margin-bottom: 6px;
      }

      .fps-player-avatar-3d {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
      }

      .fps-player-avatar .avatar-shadow {
        position: absolute;
        left: 20px;
        bottom: 0;
        width: 104px;
        height: 18px;
        border-radius: 50%;
        background: radial-gradient(ellipse at center, rgba(0, 0, 0, 0.34), rgba(0, 0, 0, 0) 72%);
        filter: blur(1.2px);
      }

      .fps-player-avatar .avatar-neck {
        position: absolute;
        top: 52px;
        left: 64px;
        width: 18px;
        height: 18px;
        border-radius: 8px;
        background: linear-gradient(180deg, var(--skin-light), var(--skin-shadow));
        border: 1px solid rgba(255, 230, 208, 0.24);
        box-shadow: inset 0 -2px 4px rgba(0, 0, 0, 0.25);
        z-index: 2;
      }

      .fps-player-avatar .avatar-head {
        position: absolute;
        top: 12px;
        left: 50px;
        width: 46px;
        height: 52px;
        border-radius: 48% 48% 46% 46% / 45% 45% 55% 55%;
        background:
          radial-gradient(circle at 34% 32%, rgba(255, 236, 220, 0.82), rgba(0, 0, 0, 0) 38%),
          radial-gradient(circle at 72% 82%, rgba(155, 92, 66, 0.18), rgba(0, 0, 0, 0) 48%),
          linear-gradient(180deg, var(--skin-light), var(--skin-mid));
        border: 1px solid rgba(255, 232, 214, 0.22);
        box-shadow: inset 0 -5px 7px rgba(0, 0, 0, 0.22), 0 5px 14px rgba(0, 0, 0, 0.22);
        z-index: 3;
      }

      .fps-player-avatar .avatar-hair {
        position: absolute;
        top: -1px;
        left: 4px;
        width: 38px;
        height: 19px;
        border-radius: 12px 12px 8px 8px;
        background:
          linear-gradient(180deg, var(--hair-light), var(--hair-dark)),
          repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.08) 0 1px, rgba(0, 0, 0, 0) 1px 4px);
        box-shadow: inset 0 -2px 3px rgba(0, 0, 0, 0.38);
      }

      .fps-player-avatar .avatar-ear {
        position: absolute;
        top: 24px;
        width: 8px;
        height: 11px;
        border-radius: 10px;
        background: linear-gradient(180deg, var(--skin-light), var(--skin-shadow));
        border: 1px solid rgba(255, 233, 216, 0.2);
      }

      .fps-player-avatar .avatar-ear.left {
        left: -5px;
      }

      .fps-player-avatar .avatar-ear.right {
        right: -5px;
      }

      .fps-player-avatar .avatar-eye {
        position: absolute;
        top: 20px;
        width: 8px;
        height: 5px;
        border-radius: 999px;
        background: #eef4ff;
        box-shadow: inset 0 -1px 1px rgba(0, 0, 0, 0.2);
      }

      .fps-player-avatar .avatar-eye.left {
        left: 11px;
      }

      .fps-player-avatar .avatar-eye.right {
        right: 11px;
      }

      .fps-player-avatar .avatar-eye::after {
        content: "";
        position: absolute;
        left: 3px;
        top: 1px;
        width: 3px;
        height: 3px;
        border-radius: 50%;
        background: #151b24;
      }

      .fps-player-avatar .avatar-nose {
        position: absolute;
        top: 25px;
        left: 20px;
        width: 6px;
        height: 9px;
        border-radius: 4px;
        background: linear-gradient(180deg, rgba(178, 120, 90, 0.28), rgba(114, 70, 51, 0.38));
      }

      .fps-player-avatar .avatar-mouth {
        position: absolute;
        top: 36px;
        left: 15px;
        width: 16px;
        height: 5px;
        border-radius: 0 0 8px 8px;
        border-bottom: 1px solid rgba(66, 33, 30, 0.72);
      }

      .fps-player-avatar .avatar-mouth::after {
        content: "";
        position: absolute;
        left: 0;
        top: 4px;
        width: 16px;
        height: 5px;
        border-radius: 999px;
        background: rgba(36, 25, 23, 0.18);
      }

      .fps-player-avatar .avatar-collar,
      .fps-player-avatar .avatar-hood,
      .fps-player-avatar .avatar-helmet-shell,
      .fps-player-avatar .avatar-helmet-rim,
      .fps-player-avatar .avatar-visor,
      .fps-player-avatar .avatar-headset,
      .fps-player-avatar .avatar-mask,
      .fps-player-avatar .avatar-respirator,
      .fps-player-avatar .avatar-canister,
      .fps-player-avatar .avatar-shoulder,
      .fps-player-avatar .avatar-chain-overlay,
      .fps-player-avatar .avatar-chest-rig,
      .fps-player-avatar .avatar-belt,
      .fps-player-avatar .avatar-pouch,
      .fps-player-avatar .avatar-kneepad,
      .fps-player-avatar .avatar-coat-tail {
        position: absolute;
        display: none;
      }

      .fps-player-avatar .avatar-collar {
        top: 56px;
        left: 43px;
        width: 60px;
        height: 22px;
        border-radius: 12px 12px 7px 7px;
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.1), rgba(0, 0, 0, 0) 48%),
          repeating-linear-gradient(135deg, var(--cloth-accent) 0 7px, color-mix(in srgb, var(--cloth-accent) 72%, black) 7px 14px);
        border: 1px solid rgba(255, 255, 255, 0.14);
        box-shadow: inset 0 -5px 8px rgba(0, 0, 0, 0.24);
        z-index: 2;
      }

      .fps-player-avatar .avatar-hood {
        top: 4px;
        left: 43px;
        width: 60px;
        height: 62px;
        border-radius: 22px 22px 18px 18px;
        background:
          linear-gradient(180deg, color-mix(in srgb, var(--armor-primary) 84%, white), var(--armor-secondary)),
          radial-gradient(circle at 50% 25%, rgba(255, 255, 255, 0.1), rgba(0, 0, 0, 0) 52%);
        border: 1px solid rgba(255, 255, 255, 0.14);
        box-shadow: inset 0 -8px 12px rgba(0, 0, 0, 0.28);
        z-index: 2;
      }

      .fps-player-avatar .avatar-helmet-shell {
        top: 4px;
        left: 45px;
        width: 58px;
        height: 31px;
